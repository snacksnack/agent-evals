name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A real Postgres for SqlRunStore's tests — triggers included, no secret,
    # no vendor. The suite stays credential-free (ADR-0031, RC1-263).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      EVAL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --extra dev --extra sql
      - name: Lint
        run: uv run ruff check .
      # RC1-452: --ddtrace reports test-level results to Test Optimization,
      # agentless. `--with` overlays ddtrace at test time only (the llmobs
      # extra stays optional). Not a test credential: the suite passes
      # identically with no key, so CI stays credential-free in ADR-0031's
      # sense.
      - name: Tests
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_CIVISIBILITY_AGENTLESS_ENABLED: "true"
          DD_SITE: datadoghq.com
          DD_SERVICE: agent-evals
          DD_ENV: ci
        run: uv run --with "ddtrace>=4.14,<5" pytest --ddtrace
