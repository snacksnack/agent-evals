name: Trend

# RC1-255. Reads the run records the consumer repos commit and publishes one
# static page. Read-only and one-directional: every source repo is public, so
# this needs no token and no write access anywhere.
# PAUSED (RC1-263). Manual-only until the run-record store is settled.
#
# This failed on the merge of PR #4 and would keep failing on every push and
# daily at 06:17 UTC. Two separate problems, stacked:
#
#   1. GitHub Pages was never enabled on the repo, so deploy-pages 404s
#      regardless of what it is handed.
#   2. The build step fetches eval-runs/runs.jsonl from five consumer repos,
#      and that file exists on none of their main branches — the PRs that would
#      have added it are being closed unmerged (RC1-263).
#
# Enabling Pages is deliberately NOT the fix. It would turn an honest failure
# into a successfully published empty page, which is worse: a red badge says
# "this is not working", a green one pointing at nothing says the opposite.
#
# Restore `push` and `schedule` when RC1-263 lands a store with records in it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the trend page
        run: uv run python -m agent_evals.trend_cli --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
