name: Trend

# RC1-255. Reads the run records the consumer repos commit and publishes one
# static page. Read-only and one-directional: every source repo is public, so
# this needs no token and no write access anywhere.
on:
  push:
    branches: [main]
  schedule:
    # Daily, so a run recorded in a consumer repo shows up without needing a
    # push here. Cheap: it fetches five files and renders.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the trend page
        run: uv run python -m agent_evals.trend_cli --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
