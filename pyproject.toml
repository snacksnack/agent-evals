[project]
name = "agent-evals"
version = "0.1.0"
description = "Quality evals for LLM systems: frozen cases, scored characteristics, a validated judge, and run records that carry cost."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reid Collins" }]

# Deliberately thin. This is a library, not a service — nothing here is
# deployed, and a consumer should not inherit a web framework to score a
# narrative. `anthropic` is the only heavy dependency and only the judge needs it.
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_evals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
