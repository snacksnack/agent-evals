[project]
name = "agent-evals"
version = "0.4.0"
description = "Quality evals for LLM systems: frozen cases, scored characteristics, a validated judge, and run records that carry cost."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reid Collins" }]

# Deliberately thin. This is a library, not a service — nothing here is
# deployed, and a consumer should not inherit a web framework to score a
# narrative. `anthropic` is the only heavy dependency and only the judge needs it.
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# An extra rather than a dependency: only `SqlRunStore` needs a driver, and a
# consumer using the JSONL store should not compile libpq to score a narrative.
# psycopg2-binary matches resumes/reid_basic — one Postgres driver in the estate.
sql = ["psycopg2-binary>=2.9"]
# Same reasoning: only a consumer shipping traces to Datadog needs an APM
# tracer. `agent_evals.llmobs.enable()` is a no-op without this extra.
llmobs = ["ddtrace>=4.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_evals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Stated rather than inferred. From inside `tests/`, ruff sorted `agent_evals`
# into the third-party block — correct-looking and wrong, and it only surfaced
# once tests arrived that import the package by name.
[tool.ruff.lint.isort]
known-first-party = ["agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
